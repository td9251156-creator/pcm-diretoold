# Verifica o código (lint), roda os testes, gera a versão final e publica no GitHub Pages.
# Em pull requests, só verifica. Em push na main (ou rodando à mão), também publica.
name: Verificar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ferramentas/navegador/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar código, testes e versão final
        run: npm run verificar
      - name: Gerar protótipo fictício PCMD-02 para revisão
        run: npm run gerar:prototipo-pcmd
      - name: Conferir recálculo externo quando houver LibreOffice
        run: |
          if command -v soffice >/dev/null 2>&1; then
            npm run verificar:recalculo-pcmd
          else
            echo 'LibreOffice ausente: recálculo externo não executado nesta máquina. Conferência no Excel 2010 permanece pendente.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar exemplo PCMD-02 e valores esperados
        uses: actions/upload-artifact@v4
        with:
          name: prototipo-pcmd-02
          path: artifacts/pcmd/
          retention-days: 30
          if-no-files-found: error
      - name: Instalar ferramenta de navegador com versão fixada
        run: npm ci --prefix ferramentas/navegador
      - name: Preparar Chromium e dependências do sistema
        run: node ferramentas/navegador/node_modules/playwright/cli.js install --with-deps chromium
      - name: Conferir fluxos no navegador, inclusive sem internet
        run: npm run test:navegador
      - name: Guardar a versão final para publicar
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
